    <!--
      SportsActivityLocation (a LocalBusiness subtype) rather than plain
      LocalBusiness — this is a sports training facility, not a generic shop,
      and Google's rich-result eligibility keys off the specific type. No
      street address yet (same open item as the legal pages' business
      details) — city/region is enough for local relevance and safe to
      publish before that's settled; add streetAddress + postalCode once
      it's final. areaServed covers the remote side of the business, which
      isn't tied to the Columbia facility at all.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "name": "Superior Performance",
        "description": "Individualized throwing programs for high school and college pitchers, built from an in-person assessment and adjusted weekly.",
        "url": "https://superior-performance-ba102.web.app/",
        "email": "superiorperformance.sp@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Columbia",
          "addressRegion": "MO",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "Columbia, MO" },
          { "@type": "Country", "name": "US" }
        ],
        "audience": {
          "@type": "Audience",
          "audienceType": "High school and college baseball pitchers"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I have to train in person?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. Programs run remotely with weekly check-ins, and in-house work is available if you're local. The assessment and the tracking are the same either way." }
          },
          {
            "@type": "Question",
            "name": "How long before I see velocity?",
            "acceptedAnswer": { "@type": "Answer", "text": "Our average is a 4mph jump over 12 weeks. Some arms move faster, some need the first block spent on movement and strength before throwing intent goes up." }
          },
          {
            "@type": "Question",
            "name": "What happens at the assessment?",
            "acceptedAnswer": { "@type": "Answer", "text": "Mobility and strength screening, a look at your delivery, and a review of your current throwing workload. That's what the program gets written from." }
          },
          {
            "@type": "Question",
            "name": "Can I run this during my season?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. In-season programs are built to maintain velocity and manage workload, not to add volume on top of your outings." }
          },
          {
            "@type": "Question",
            "name": "What ages do you work with?",
            "acceptedAnswer": { "@type": "Answer", "text": "Primarily high school and college pitchers. If you're outside that range, send a note and we'll tell you honestly whether we're the right fit." }
          }
        ]
      }
    </script>
